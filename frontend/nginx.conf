server {
    listen 8080;
    server_tokens off;
    root /usr/share/nginx/html;

    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    # Add Strict-Transport-Security at the TLS terminator that fronts this container.

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        # Overwrite, never append, so clients cannot spoof their address.
        proxy_set_header X-Forwarded-For $remote_addr;
        client_max_body_size 64k;
    }
    location / { try_files $uri /index.html; }
}
